name: CI

on:
  push:
    branches: [dev, "feature/**"]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run pytest tests/ -v
        env:
          GCS_BUCKET_NAME: test-bucket
          NEXUS_API_KEY: test-key
          DISCORD_WEBHOOK_URL: ""
          FANDOM_BOT_NAME: test-user
          FANDOM_BOT_PASSWORD: test-password
