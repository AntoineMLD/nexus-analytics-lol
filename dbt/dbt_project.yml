name: nexus_analytics
version: "0.1.0"
config-version: 2

# Profil défini dans dbt/profiles.yml (ou ~/.dbt/profiles.yml)
profile: nexus_analytics

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  nexus_analytics:
    # staging : vues légères sur les tables raw chargées par bq_loader
    staging:
      +materialized: view
      +schema: staging

    # dimensions et faits : tables persistées dans le dataset gold
    dimensions:
      +materialized: table
      +schema: gold

    facts:
      +materialized: table
      +schema: gold

snapshots:
  nexus_analytics:
    +target_schema: gold
