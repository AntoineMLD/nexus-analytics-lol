version: 2

models:
  - name: fact_player_game
    description: >
      Table de faits principale : une ligne par joueur par partie LFL.
      Enrichit les stats individuelles avec les informations du match
      (durée, patch, équipes) et calcule le KDA ratio.
    columns:
      - name: game_id
        description: "Clé étrangère vers stg_lfl_matches."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_lfl_matches')
                field: game_id
      - name: player_link
        description: "Clé étrangère vers dim_player."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_player')
                field: player_id
      - name: player_win
        description: "True si le joueur a gagné cette partie."
      - name: kda_ratio
        description: "(kills + assists) / max(deaths, 1) — arrondi à 2 décimales."
      - name: gamelength_seconds
        description: "Durée de la partie en secondes (issu du match)."

  - name: fact_meta_trend
    description: >
      Table de faits méta : pick rates et winrates par champion, patch et tournoi.
      Granularité : (champion, patch, overview_page).
    columns:
      - name: champion
        description: "Nom du champion."
        tests:
          - not_null
      - name: patch
        description: "Version du patch."
        tests:
          - not_null
      - name: overview_page
        description: "Tournoi/split (clé étrangère vers stg_lfl_matches)."
        tests:
          - not_null
      - name: pick_rate_pct
        description: "Taux de sélection en pourcentage du total de parties du tournoi+patch."
      - name: win_rate_pct
        description: "Taux de victoire en pourcentage pour ce champion sur ce patch."

  - name: fact_draft
    description: >
      Table de faits draft : une ligne par action (pick ou ban) par partie LFL.
      Permet d'analyser les stratégies de draft des équipes (champion priorities,
      first pick/ban, win rates par position dans le draft).
    columns:
      - name: game_id
        description: "Identifiant de la partie."
        tests:
          - not_null
      - name: champion
        description: "Champion sélectionné ou banni."
        tests:
          - not_null
      - name: action_type
        description: "Type d'action : 'pick' ou 'ban'."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["pick", "ban"]
      - name: team_side
        description: "Côté de l'équipe dans la partie : 1 (bleu) ou 2 (rouge)."
        tests:
          - not_null

  - name: fact_oe_player_game
    description: >
      Table de faits Oracle's Elixir : métriques avancées par joueur par partie LFL.
      Complément de fact_player_game (Leaguepedia) avec les données non disponibles
      dans Leaguepedia : gold/CS diff à 10/15 min, CS par minute, DPM.
      Source indépendante — game_id au format Riot, non joignable directement
      sur fact_player_game.game_id.
    columns:
      - name: game_id
        description: "Identifiant de partie au format Riot (ESPORTSTMNT01_...)."
        tests:
          - not_null
      - name: player_name
        description: "Pseudo du joueur."
        tests:
          - not_null
      - name: position
        description: "Rôle dans la partie."
        tests:
          - not_null
      - name: gold_diff_at_15
        description: "Différentiel d'or à 15 min vs joueur adverse même rôle. NULL avant 2021."
      - name: cs_per_min
        description: "CS par minute. NULL si absent dans la source."
      - name: damage_per_min
        description: "Dégâts par minute (DPM)."
