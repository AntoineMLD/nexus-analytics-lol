version: 2

sources:
  - name: raw
    description: "Tables brutes chargées depuis GCS Silver par pipeline/loaders/bq_loader.py."
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: raw
    tables:
      - name: lfl_matches
        description: "Matchs LFL normalisés (ScoreboardGames Silver)."
      - name: lfl_player_stats
        description: "Stats joueurs LFL normalisées (ScoreboardPlayers Silver)."
      - name: lfl_players
        description: "Joueurs LFL avec leurs comptes EUW Soloqueue."
      - name: lfl_drafts
        description: "Actions de draft LFL (picks et bans) dépivotées depuis PicksAndBansS7."
      - name: oracle_elixir
        description: "Stats avancées joueur LFL depuis Oracle's Elixir CSV (golddiffat15, cspm, dpm)."
      - name: riot_players
        description: "PUUIDs des joueurs LFL depuis l'API Riot Games (silver/riot_api/riot_players/)."

models:
  - name: stg_lfl_matches
    description: "Vue staging sur lfl_matches : sélection des colonnes et cast datetime."
    columns:
      - name: game_id
        description: "Identifiant unique de la partie (clé primaire)."
        tests:
          - not_null
          - unique
      - name: match_id
        description: "Identifiant du match (une série de parties)."
        tests:
          - not_null
      - name: datetime_utc
        tests:
          - not_null
      - name: team1
        tests:
          - not_null
      - name: team2
        tests:
          - not_null
      - name: win_team
        tests:
          - not_null

  - name: stg_lfl_player_stats
    description: "Vue staging sur lfl_player_stats : une ligne par joueur par partie."
    columns:
      - name: game_id
        description: "Référence à stg_lfl_matches.game_id."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_lfl_matches')
                field: game_id
      - name: player_link
        description: "Identifiant wiki du joueur (clé dans dim_player)."
        tests:
          - not_null
      - name: team
        tests:
          - not_null
      - name: champion
        tests:
          - not_null
      - name: role
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Top", "Jungle", "Mid", "Bot", "Support"]

  - name: stg_oracle_elixir
    description: "Vue staging Oracle's Elixir : une ligne par joueur par partie LFL. Métriques avancées non disponibles dans Leaguepedia."
    columns:
      - name: game_id
        description: "Identifiant de partie au format Riot (ESPORTSTMNT01_...)."
        tests:
          - not_null
      - name: player_name
        description: "Pseudo du joueur."
        tests:
          - not_null
      - name: position
        description: "Rôle dans la partie."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["top", "jng", "mid", "bot", "sup"]

  - name: stg_riot_players
    description: "Vue staging Riot API : association joueur → PUUID."
    columns:
      - name: player_name
        description: "Pseudo du joueur LFL."
        tests:
          - not_null
          - unique
      - name: puuid
        description: "PUUID Riot Games (78 caractères)."
        tests:
          - not_null
          - unique

  - name: stg_lfl_drafts
    description: "Vue staging sur lfl_drafts : une ligne par action pick/ban par partie."
    columns:
      - name: game_id
        tests:
          - not_null
      - name: champion
        tests:
          - not_null
      - name: action_type
        tests:
          - not_null
      - name: team_side
        tests:
          - not_null
