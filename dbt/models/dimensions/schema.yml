version: 2

models:
  - name: dim_team
    description: "Dimension équipes : liste dédupliquée avec stats de présence."
    columns:
      - name: team_name
        description: "Nom de l'équipe (clé primaire)."
        tests:
          - not_null
          - unique
      - name: total_games
        tests:
          - not_null

  - name: dim_player
    description: "Dimension joueurs : un joueur unique avec ses statistiques agrégées."
    columns:
      - name: player_id
        description: "player_link wiki (clé primaire)."
        tests:
          - not_null
          - unique
      - name: player_name
        tests:
          - not_null
      - name: total_games
        tests:
          - not_null
      - name: win_rate_pct
        description: "Taux de victoire en pourcentage (0-100)."

  - name: dim_champion
    description: "Dimension champions : statistiques agrégées par champion sur toutes les parties LFL."
    columns:
      - name: champion
        description: "Nom du champion (clé primaire)."
        tests:
          - not_null
          - unique
      - name: total_games_played
        tests:
          - not_null
      - name: win_rate_pct
        description: "Taux de victoire global en pourcentage (0-100)."

  - name: dim_patch
    description: "Dimension patches : une ligne par version du jeu observée en LFL."
    columns:
      - name: patch
        description: "Version du patch (ex: 14.5), clé primaire."
        tests:
          - not_null
          - unique
      - name: total_games
        tests:
          - not_null

  - name: dim_player_current_team
    description: >
      Dimension SCD2 — source : équipe actuelle de chaque joueur LFL.
      Une ligne par joueur (player_id unique), représente l'état le plus
      récent dans nos données. Alimenté le snapshot snap_player_team
      qui implémente SCD Type 2 et conserve l'historique des changements
      d'équipe avec des plages dbt_valid_from / dbt_valid_to.
    columns:
      - name: player_id
        description: "player_link wiki (clé primaire). Référence dim_player."
        tests:
          - not_null
          - unique
      - name: player_name
        tests:
          - not_null
      - name: current_team
        description: "Équipe la plus récente dans laquelle le joueur a joué."
        tests:
          - not_null
      - name: last_game_date
        description: "Date de la dernière partie connue dans cette équipe."
      - name: total_games_in_team
        description: "Nombre de parties jouées dans l'équipe actuelle."
      - name: all_teams_played
        description: "Tableau (ARRAY) de toutes les équipes jouées par ce joueur."
